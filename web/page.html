  <link rel="stylesheet" href="css/base.css">

  <style>
    .page-body { max-width: 760px; margin: 0 auto; padding: var(--space-7) var(--space-4) var(--space-8); min-height: 60vh; }
    .page-body h1 { margin-bottom: var(--space-4); }
    .page-body h2 { margin: var(--space-6) 0 var(--space-2); font-size: var(--text-lg); }
    .page-body p { margin: 0 0 var(--space-3); line-height: 1.65; }

<body class="landing">
  <header class="site-header">

  <footer class="site-footer">

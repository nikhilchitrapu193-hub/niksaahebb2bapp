<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Purchase order — Fresh Supply</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    /* Purchase-order layout (same look as the invoice); prints cleanly on A4. */
    .invoice { max-width: 860px; margin: var(--space-5) auto; background: var(--surface); padding: var(--space-6); border: 1px solid var(--line); border-radius: var(--radius-lg); }
    .invoice-head { display: flex; justify-content: space-between; gap: var(--space-5); flex-wrap: wrap; margin-bottom: var(--space-5); }
    .invoice h1 { font-size: var(--text-xl); }
    .parties { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-5); margin: var(--space-5) 0; }
    .parties h3 { color: var(--ink-muted); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--space-1); }
    .totals { margin-left: auto; width: 320px; }
    .invoice-note { margin-top: var(--space-5); color: var(--ink-muted); font-size: var(--text-sm); }
    .print-bar { max-width: 860px; margin: var(--space-4) auto 0; display: flex; gap: var(--space-2); justify-content: flex-end; }
    @media print {
      body { background: #fff; }
      .print-bar { display: none; }
      .invoice { border: 0; margin: 0; padding: 0; max-width: none; }
    }
  </style>
</head>
<body>
  <div class="print-bar"><button class="btn" onclick="history.back()">Back</button><button class="btn primary" onclick="print()">Print / Save as PDF</button></div>
  <main class="invoice" id="invoice"><div class="loading"><span class="spinner"></span> Loading…</div></main>
  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/pages/po.js"></script>
</body>
</html>

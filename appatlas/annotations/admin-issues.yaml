  why_it_exists: "Short, damaged or wrong items are put right with a credit on the account instead of cash refunds."
  what_if_i_change_it: "Resolving with a credit amount raises a credit note that applies itself to the customer's oldest pay-later invoice."
  what_if_wrong: "A credit typed too high gives money away; it can only be corrected with a debit note."

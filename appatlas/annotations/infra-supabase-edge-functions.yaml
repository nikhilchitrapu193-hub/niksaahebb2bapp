  what_is_this: "Small server programs for the jobs the browser must not do itself: inviting staff and customer members, rescuing customer logins, sending SMS and email, and taking online payments."
  why_it_exists: "They hold secret keys (service role, payment and SMS keys) that must never reach the browser."
  what_if_i_change_it: "Secrets are set in Supabase → Edge Functions → Secrets; deploying a new version replaces the old one at once."
  what_if_wrong: "A function that is not deployed makes its button fail (online payment today). A wrong secret makes messages or payments fail."
  prerequisites: "Supabase CLI to deploy: supabase functions deploy <name>."
